# Host nginx site for dorbrij.ir -> the dorbrij-web container on 127.0.0.1:3020.
# Install as /etc/nginx/sites-available/dorbrij.ir and symlink into
# sites-enabled. Deliberately HTTP-only: `certbot --nginx -d dorbrij.ir -d
# www.dorbrij.ir` rewrites this file in place to add the TLS server block and
# the 80 -> 443 redirect, the same way it did for app.omatekk.com.

server {
    listen 80;
    listen [::]:80;
    server_name dorbrij.ir www.dorbrij.ir;

    access_log /var/log/nginx/dorbrij.access.log;
    error_log  /var/log/nginx/dorbrij.error.log;

    # The container already gzips and sets cache headers; nothing to add here.
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
