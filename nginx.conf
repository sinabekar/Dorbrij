server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS, HTTP/2 and the real-IP headers are the host nginx's job; this
    # container only ever sees proxied plaintext on the Docker bridge.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    # Hashed build assets — safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /favicon.ico { access_log off; expires 7d; }

    # `output: 'export'` writes /about as about.html, so a bare path has to
    # fall through to the .html file before giving up.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
